name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ninja-planner

jobs:
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (server + client)
        run: npm run typecheck

      - name: Server tests
        run: npm test

      - name: Client tests
        run: npm run test:client

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_STG }}

  docker:
    name: Docker Build & Push
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_STG }}

  # GitHub-hosted runners cannot reach the private staging host (10.10.0.50), so this job runs on
  # a self-hosted runner ON the staging host. It only runs once a runner with these labels has
  # been registered there (repo Settings -> Actions -> Runners -> New self-hosted runner, labels
  # `ninja-stg`); until then the job just stays queued.
  # The deploy is the same pull + build + compose flow as a manual staging deploy:
  # scripts/deploy-stg.sh (docker-compose.stg.yml, /srv/secrets/ninja-planner.stg.env, port 3208).
  # The checkout it runs in is the server's own clone, so the runner's workspace is not used.
  deploy-staging:
    name: Deploy -> Staging
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, ninja-stg]
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Deploy to ninja-stg001
        env:
          APP_DIR: /srv/apps/ninja-planner
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          bash scripts/deploy-stg.sh
          echo "ninja-planner ${GITHUB_SHA::7} live on staging"
