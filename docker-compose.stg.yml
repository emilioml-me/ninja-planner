services:
  ninja-planner-stg:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at build time — export before running build
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY must be exported (scripts/deploy-stg.sh does this)}
    container_name: ninja-planner-stg
    restart: unless-stopped
    # Graceful shutdown drains in-flight background work for up to 20s (hard exit at 25s).
    stop_grace_period: 30s
    env_file: /srv/secrets/ninja-planner.stg.env
    # network_mode: host means there is no port mapping to restrict, so the bind address is the
    # only thing keeping :3208 off the LAN (direct hits would bypass nginx and its X-Forwarded-For).
    # HOST=127.0.0.1 makes the app bind loopback only; nginx on this host proxies to 127.0.0.1:3208.
    network_mode: host
    environment:
      PORT: "3208"
      HOST: "127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3208/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
