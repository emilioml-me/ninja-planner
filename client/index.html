<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, canonical, robots and the og/twitter url/title/description are rewritten
         per route by src/lib/seoMeta.ts (and lang: Spanish public pages, English app). Keep these
         defaults in sync with the homepage entry there and with Landing.tsx's <SeoHead>. -->
    <title>Planificador de Equipo y Dashboard Empresarial | Ninja Planner</title>
    <meta name="description" content="Organiza las tareas, metas, roadmap y métricas de negocio de tu equipo en un solo lugar. Planificador para pymes en México y LATAM." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#c7490a" />
    <link rel="canonical" href="https://ninja-planner.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Ninja Planner" />
    <meta property="og:title" content="Planificador de Equipo y Dashboard Empresarial | Ninja Planner" />
    <meta property="og:description" content="Organiza las tareas, metas, roadmap y métricas de negocio de tu equipo en un solo lugar. Planificador para pymes en México y LATAM." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ninja-planner.com/" />
    <meta property="og:image" content="https://ninja-planner.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_MX" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ninjastackHQ" />
    <meta name="twitter:url" content="https://ninja-planner.com/" />
    <meta name="twitter:title" content="Planificador de Equipo y Dashboard Empresarial | Ninja Planner" />
    <meta name="twitter:description" content="Organiza las tareas, metas, roadmap y métricas de negocio de tu equipo en un solo lugar. Planificador para pymes en México y LATAM." />
    <meta name="twitter:image" content="https://ninja-planner.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
