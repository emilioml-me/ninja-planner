services:
  ninja-planner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at build time. Fail the build instead of shipping an empty key:
        #   export VITE_CLERK_PUBLISHABLE_KEY=$(grep -E '^VITE_CLERK_PUBLISHABLE_KEY=' /srv/secrets/ninja-planner.env | cut -d= -f2- | tr -d "\"'")
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY must be exported before docker compose build}
    container_name: ninja-planner
    restart: unless-stopped
    # Graceful shutdown drains in-flight background work for up to 20s (hard exit at 25s).
    stop_grace_period: 30s
    env_file: /srv/secrets/ninja-planner.env
    ports:
      - "127.0.0.1:3207:3206"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3206/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ninja-internal

networks:
  ninja-internal:
    external: true
