<!DOCTYPE html>
<!--
  Source of client/public/og-image.png (1200x630 link-preview image).
  Rendered with headless Chrome, e.g. on the LAN box:
    docker run --rm -v "$PWD:/work" zenika/alpine-chrome --no-sandbox --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=/work/og-image.png file:///work/og-image.html
  Brand: primary hsl(20 90% 41%) = #c7490a, Sora, light background. Copy matches the es-MX landing.
-->
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Sora', 'DejaVu Sans', sans-serif;
    color: #1c1917;
    background: #ffffff;
    position: relative;
  }
  .glow {
    position: absolute; border-radius: 50%; filter: blur(70px);
  }
  .glow.a { width: 520px; height: 520px; right: -120px; top: -160px; background: #fde4d3; }
  .glow.b { width: 380px; height: 380px; left: -140px; bottom: -180px; background: #fef1e7; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #c7490a; }

  .left { position: absolute; left: 76px; top: 64px; width: 660px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 56px; height: 56px; border-radius: 14px; background: #c7490a;
    display: flex; align-items: center; justify-content: center;
  }
  .brand span { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }

  h1 {
    margin-top: 64px; font-size: 62px; line-height: 1.08; font-weight: 800; letter-spacing: -2px;
  }
  h1 em { font-style: normal; color: #c7490a; }
  p.sub { margin-top: 26px; font-size: 26px; line-height: 1.4; color: #57534e; font-weight: 400; }
  .url {
    position: absolute; left: 76px; bottom: 56px;
    font-size: 22px; font-weight: 600; color: #c7490a;
    padding: 10px 20px; border: 2px solid #f3c9ae; border-radius: 999px; background: #fff;
  }

  /* Kanban sketch */
  .board {
    position: absolute; right: 56px; top: 50%; width: 380px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: start;
    padding: 18px; border-radius: 22px; background: #fafaf9; border: 1px solid #e7e5e4;
    box-shadow: 0 18px 50px rgba(120, 53, 15, 0.12);
    transform: translateY(-50%) rotate(-2deg);
  }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .col h4 { font-size: 13px; font-weight: 600; color: #78716c; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .card {
    background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 10px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .line { height: 8px; border-radius: 4px; background: #e7e5e4; }
  .line.s { width: 60%; }
  .line.m { width: 80%; }
  .tag { width: 44%; height: 8px; border-radius: 4px; }
  .t1 { background: #f6b48a; } .t2 { background: #fcd9c2; } .t3 { background: #c7490a; }
  .done .line { background: #d6d3d1; }
  .check {
    width: 18px; height: 18px; border-radius: 50%; background: #c7490a; align-self: flex-end;
  }
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="bar"></div>

  <div class="left">
    <div class="brand">
      <div class="logo">
        <!-- lucide "briefcase" (same icon as the app) -->
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          <rect width="20" height="14" x="2" y="6" rx="2"/>
        </svg>
      </div>
      <span>Ninja Planner</span>
    </div>
    <h1>El centro de mando<br /><em>de tu equipo.</em></h1>
    <p class="sub">Tareas, sprints, OKR y roadmap<br />en un solo lugar, para pymes.</p>
  </div>
  <div class="url">ninja-planner.com</div>

  <div class="board">
    <div class="col">
      <h4>Pendiente</h4>
      <div class="card"><div class="tag t1"></div><div class="line"></div><div class="line s"></div></div>
      <div class="card"><div class="tag t2"></div><div class="line m"></div></div>
      <div class="card"><div class="tag t1"></div><div class="line"></div><div class="line s"></div></div>
    </div>
    <div class="col">
      <h4>En curso</h4>
      <div class="card"><div class="tag t3"></div><div class="line"></div><div class="line m"></div></div>
      <div class="card"><div class="tag t2"></div><div class="line s"></div></div>
      <div class="card"><div class="tag t1"></div><div class="line m"></div><div class="line s"></div></div>
    </div>
    <div class="col">
      <h4>Listo</h4>
      <div class="card done"><div class="line"></div><div class="line s"></div><div class="check"></div></div>
      <div class="card done"><div class="line m"></div><div class="check"></div></div>
      <div class="card done"><div class="line"></div><div class="line s"></div><div class="check"></div></div>
    </div>
  </div>
</body>
</html>
