openapi: 3.0.3
info:
  title: Ninja Planner API
  version: 1.1.0
  description: |
    Multi-tenant business planning SaaS (ninja-planner) — REST API.

    This spec covers the most commonly integrated routes; it is not an exhaustive list of every
    internal endpoint the web app uses.

    **Session API (`/api/*`)**: requires a Clerk-issued session JWT in
    `Authorization: Bearer <token>`. The workspace is resolved server-side from the Clerk
    organization claim in the token (the user's active organization); there is no workspace
    header or parameter. Routes marked "admin only" require the `org:admin` or `org:owner` role.

    **External API (`/api/external/*`)**: for third-party integrations. Authenticate with a
    workspace API key (created under Settings > API keys) in `Authorization: Bearer np_...`.
    Each route requires a specific key scope. Failed authentication attempts are rate limited
    per IP (20/min) and each key is limited to 300 requests/min.

    **Errors**: `{ "error": ... }`. Validation failures return 400 with `error` set to a zod
    `flatten()` object (`{ formErrors: string[], fieldErrors: { [field]: string[] } }`).

servers:
  - url: https://ninja-planner.com
    description: Production
  - url: https://ninja-planner.njn-stg.com
    description: Staging
  - url: http://localhost:3206
    description: Local dev

tags:
  - name: Health
  - name: Tasks
  - name: Sprints
  - name: Epics
  - name: Goals
  - name: Timeline
  - name: Budgets
  - name: Members
  - name: Notifications
  - name: Support
  - name: Subscription
  - name: External API

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Workspace API key (`np_...`), sent as a Bearer token

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed (e.g. admin only, or API key lacks the required scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                formErrors:  { type: array, items: { type: string } }
                fieldErrors:
                  type: object
                  additionalProperties: { type: array, items: { type: string } }

    TaskStatus:
      type: string
      enum: [todo, in_progress, done, blocked]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    ChecklistItem:
      type: object
      required: [id, text, done]
      properties:
        id:   { type: string, maxLength: 64, description: Client-generated id }
        text: { type: string, maxLength: 500 }
        done: { type: boolean }

    Task:
      type: object
      properties:
        id:                { type: string, format: uuid }
        workspace_id:      { type: string, format: uuid }
        title:             { type: string }
        description:       { type: string, nullable: true }
        status:            { $ref: '#/components/schemas/TaskStatus' }
        priority:          { $ref: '#/components/schemas/TaskPriority' }
        assignee_clerk_id: { type: string, nullable: true }
        due_date:          { type: string, format: date, nullable: true }
        start_date:        { type: string, format: date, nullable: true }
        tags:              { type: array, items: { type: string } }
        position:          { type: integer }
        story_points:      { type: integer, nullable: true }
        sprint_id:         { type: string, format: uuid, nullable: true }
        epic_id:           { type: string, format: uuid, nullable: true }
        recurrence_rule:
          type: string
          nullable: true
          enum: [daily, weekly, biweekly, monthly]
        spawned_from_id:   { type: string, format: uuid, nullable: true }
        checklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        created_by:        { type: string }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

    TaskActivity:
      type: object
      properties:
        id:             { type: string, format: uuid }
        task_id:        { type: string, format: uuid }
        actor_clerk_id: { type: string }
        action:         { type: string, example: updated }
        payload:        { type: object, additionalProperties: true, nullable: true }
        created_at:     { type: string, format: date-time }

    TaskWrite:
      type: object
      properties:
        description:       { type: string, maxLength: 10000 }
        status:            { $ref: '#/components/schemas/TaskStatus' }
        priority:          { $ref: '#/components/schemas/TaskPriority' }
        assignee_clerk_id: { type: string, nullable: true, description: Must be a workspace member; null = unassigned }
        due_date:          { type: string, format: date, nullable: true }
        start_date:        { type: string, format: date, nullable: true }
        tags:              { type: array, items: { type: string } }
        sprint_id:         { type: string, format: uuid, nullable: true }
        epic_id:           { type: string, format: uuid, nullable: true }
        recurrence_rule:
          type: string
          nullable: true
          enum: [daily, weekly, biweekly, monthly]
        story_points:      { type: integer, minimum: 0, maximum: 144, nullable: true }
        checklist:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ChecklistItem' }

    TimeLog:
      type: object
      properties:
        id:              { type: string, format: uuid }
        task_id:         { type: string, format: uuid }
        workspace_id:    { type: string, format: uuid }
        user_clerk_id:   { type: string }
        display_name:    { type: string, nullable: true }
        minutes:         { type: integer }
        note:            { type: string, nullable: true }
        billable:        { type: boolean }
        hourly_rate:     { type: string, nullable: true, description: NUMERIC(10,2) as a string }
        budget_entry_id: { type: string, format: uuid, nullable: true }
        logged_at:       { type: string, format: date-time }
        created_at:      { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id:            { type: string, format: uuid }
        task_id:       { type: string, format: uuid }
        workspace_id:  { type: string, format: uuid }
        file_name:     { type: string }
        file_size:     { type: integer }
        mime_type:     { type: string }
        uploaded_by:   { type: string }
        uploader_name: { type: string, nullable: true }
        created_at:    { type: string, format: date-time }

    Sprint:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        status:
          type: string
          enum: [planning, active, completed]
        start_date: { type: string, format: date, nullable: true }
        end_date:   { type: string, format: date, nullable: true }
        goal:       { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Epic:
      type: object
      properties:
        id:           { type: string, format: uuid }
        title:        { type: string }
        description:  { type: string, nullable: true }
        color:        { type: string, example: '#6366f1' }
        status:
          type: string
          enum: [active, completed, archived]
        external_ref: { type: string, nullable: true }
        total_tasks:  { type: integer }
        done_tasks:   { type: integer }
        total_points: { type: integer }
        done_points:  { type: integer }
        created_by:   { type: string }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    Goal:
      type: object
      properties:
        id:          { type: string, format: uuid }
        title:       { type: string }
        description: { type: string, nullable: true }
        status:
          type: string
          enum: [active, completed, cancelled]
        due_date:    { type: string, format: date, nullable: true }
        total_tasks: { type: integer, description: Linked tasks + roadmap items }
        done_tasks:  { type: integer, description: Linked done tasks + live roadmap items }
        created_by:  { type: string }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        recipient_clerk_id: { type: string }
        type:               { type: string, example: task_assigned }
        title:              { type: string }
        body:               { type: string, nullable: true }
        link:               { type: string, nullable: true }
        read_at:            { type: string, format: date-time, nullable: true }
        created_at:         { type: string, format: date-time }

    SubscriptionStatus:
      type: object
      properties:
        active:        { type: boolean }
        plan:          { type: string, nullable: true }
        expiresAt:     { type: string, format: date-time, nullable: true }
        adminOverride: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [no_code, expired, app_not_allowed, revoked, ninja_core_unreachable]

    ExternalTask:
      type: object
      properties:
        id:                { type: string, format: uuid }
        title:             { type: string }
        status:            { $ref: '#/components/schemas/TaskStatus' }
        priority:          { $ref: '#/components/schemas/TaskPriority' }
        assignee_clerk_id: { type: string, nullable: true }
        due_date:          { type: string, format: date, nullable: true }
        story_points:      { type: integer, nullable: true }
        sprint_id:         { type: string, format: uuid, nullable: true }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  app:    { type: string, example: ninja-planner }

  # ── Tasks ──────────────────────────────────────────────────────────────────
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: |
        Returns at most `limit` tasks (default 500, max 1000). The `X-Total-Count` response
        header carries the total number of matching tasks so clients can detect truncation.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/TaskPriority' }
        - name: assignee
          in: query
          schema: { type: string }
          description: Clerk user id
        - name: tag
          in: query
          schema: { type: string }
        - name: due_before
          in: query
          schema: { type: string, format: date }
        - name: due_after
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Array of tasks
          headers:
            X-Total-Count:
              description: Total number of tasks matching the filters
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TaskWrite'
                - type: object
                  required: [title]
                  properties:
                    title:    { type: string, minLength: 1, maxLength: 500 }
                    position: { type: integer }
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/tasks/bulk:
    post:
      tags: [Tasks]
      summary: Bulk update or delete up to 200 tasks
      description: '`action: delete` is admin only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, ids, changes]
                  properties:
                    action: { type: string, enum: [update] }
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items: { type: string, format: uuid }
                    changes:
                      type: object
                      additionalProperties: false
                      properties:
                        status:            { $ref: '#/components/schemas/TaskStatus' }
                        priority:          { $ref: '#/components/schemas/TaskPriority' }
                        assignee_clerk_id: { type: string, nullable: true }
                        sprint_id:         { type: string, format: uuid, nullable: true }
                - type: object
                  required: [action, ids]
                  properties:
                    action: { type: string, enum: [delete] }
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items: { type: string, format: uuid }
      responses:
        '200': { description: Result summary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tasks]
      summary: Get a task with its activity log
      responses:
        '200':
          description: Task and activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:     { $ref: '#/components/schemas/Task' }
                  activity:
                    type: array
                    items: { $ref: '#/components/schemas/TaskActivity' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      summary: Update a task (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TaskWrite'
                - type: object
                  properties:
                    title: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Soft-delete a task (admin only)
      responses:
        '204': { description: Task deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{taskId}/time-logs:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tasks]
      summary: List time logs for a task (newest first)
      responses:
        '200':
          description: Time log entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimeLog' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tasks]
      summary: Log time on a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes:     { type: integer, minimum: 1, maximum: 14400 }
                note:        { type: string, maxLength: 500 }
                billable:    { type: boolean }
                hourly_rate:
                  type: number
                  minimum: 0
                  maximum: 10000
                  nullable: true
                  description: Admins only (403 for members)
      responses:
        '201':
          description: Time log created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{taskId}/attachments:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tasks]
      summary: List attachments for a task
      responses:
        '200':
          description: Attachment metadata list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: File attachments are not configured on this server }
    post:
      tags: [Tasks]
      summary: Confirm an upload made with a presigned URL and save the attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, file_size, mime_type, r2_key]
              properties:
                file_name: { type: string, maxLength: 255 }
                file_size: { type: integer, minimum: 1, maximum: 52428800 }
                mime_type: { type: string, maxLength: 100 }
                r2_key:    { type: string, maxLength: 500, description: Key returned by /presign (bound to the caller) }
      responses:
        '201':
          description: Attachment saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Attachment already saved }

  /api/tasks/{taskId}/attachments/presign:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    post:
      tags: [Tasks]
      summary: Get a short-lived presigned R2 upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, mime_type, file_size]
              properties:
                file_name: { type: string, maxLength: 255 }
                mime_type: { type: string, maxLength: 100 }
                file_size: { type: integer, minimum: 1, maximum: 52428800 }
      responses:
        '200':
          description: Presigned upload URL (PUT the file to it, then POST the attachment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url: { type: string, format: uri }
                  r2_key:     { type: string }
                  file_name:  { type: string, description: Sanitized file name }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ── Sprints ────────────────────────────────────────────────────────────────
  /api/sprints:
    get:
      tags: [Sprints]
      summary: List sprints
      responses:
        '200':
          description: Sprint list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sprint' }
    post:
      tags: [Sprints]
      summary: Create a sprint (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string, minLength: 1, maxLength: 255 }
                goal:       { type: string, maxLength: 2000, nullable: true }
                status:
                  type: string
                  enum: [planning, active, completed]
                start_date: { type: string, format: date, nullable: true }
                end_date:   { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Sprint created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/sprints/{id}/burndown:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Sprints]
      summary: Burndown chart data for a sprint
      description: '`points` is empty when the sprint has no start/end date.'
      responses:
        '200':
          description: Burndown series
          content:
            application/json:
              schema:
                type: object
                properties:
                  start_date:   { type: string, format: date, nullable: true }
                  end_date:     { type: string, format: date, nullable: true }
                  total_tasks:  { type: integer }
                  total_points: { type: integer }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date:             { type: string, format: date }
                        remaining_tasks:  { type: integer }
                        remaining_points: { type: integer }
                        ideal_tasks:      { type: integer }
                        ideal_points:     { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Epics ──────────────────────────────────────────────────────────────────
  /api/epics:
    get:
      tags: [Epics]
      summary: List epics with task/point rollups
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, archived]
      responses:
        '200':
          description: Epic list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Epic' }
    post:
      tags: [Epics]
      summary: Create an epic (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:        { type: string, minLength: 1, maxLength: 500 }
                description:  { type: string }
                status:
                  type: string
                  enum: [active, completed, archived]
                color:        { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
                external_ref: { type: string, maxLength: 500, nullable: true, description: http(s) URL, e.g. a GitHub issue }
      responses:
        '201':
          description: Epic created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Epic' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Goals ──────────────────────────────────────────────────────────────────
  /api/goals:
    get:
      tags: [Goals]
      summary: List goals with progress counts
      responses:
        '200':
          description: Goal list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Goal' }
    post:
      tags: [Goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:       { type: string, minLength: 1, maxLength: 500 }
                description: { type: string, maxLength: 5000, nullable: true }
                due_date:    { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/goals/{id}/links:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Goals]
      summary: Link a task or roadmap item to a goal (counts toward progress)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type: { type: string, enum: [task, roadmap_item] }
                entity_id:   { type: string, format: uuid }
      responses:
        '201': { description: Linked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Link already exists }

  # ── Timeline ───────────────────────────────────────────────────────────────
  /api/timeline:
    get:
      tags: [Timeline]
      summary: Gantt data — dated tasks (capped, closest to today) + sprints
      responses:
        '200':
          description: Timeline payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:                { type: string, format: uuid }
                        title:             { type: string }
                        status:            { $ref: '#/components/schemas/TaskStatus' }
                        priority:          { $ref: '#/components/schemas/TaskPriority' }
                        start_date:        { type: string, format: date, nullable: true }
                        due_date:          { type: string, format: date, nullable: true }
                        assignee_clerk_id: { type: string, nullable: true }
                        assignee_name:     { type: string, nullable: true }
                        sprint_id:         { type: string, format: uuid, nullable: true }
                        sprint_name:       { type: string, nullable: true }
                        epic_id:           { type: string, format: uuid, nullable: true }
                        epic_title:        { type: string, nullable: true }
                        epic_color:        { type: string, nullable: true }
                        story_points:      { type: integer, nullable: true }
                  sprints:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: string, format: uuid }
                        name:       { type: string }
                        status:     { type: string }
                        start_date: { type: string, format: date, nullable: true }
                        end_date:   { type: string, format: date, nullable: true }
                  truncated:
                    type: boolean
                    description: True when tasks farthest from today were left out

  # ── Budgets ────────────────────────────────────────────────────────────────
  /api/budgets:
    get:
      tags: [Budgets]
      summary: List budgets with actual spend (entries + billable time cost)
      responses:
        '200': { description: Budget list }
    post:
      tags: [Budgets]
      summary: Create a budget (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target_amount]
              properties:
                name:          { type: string, maxLength: 255 }
                description:   { type: string, maxLength: 2000, nullable: true }
                target_amount: { type: number, minimum: 0 }
                currency:      { type: string, minLength: 3, maxLength: 3, default: USD }
                period_start:  { type: string, format: date, nullable: true }
                period_end:    { type: string, format: date, nullable: true }
                status:        { type: string, enum: [active, closed] }
                epic_id:       { type: string, format: uuid, nullable: true }
                sprint_id:     { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Budget created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Members ────────────────────────────────────────────────────────────────
  /api/workspaces/me/members:
    get:
      tags: [Members]
      summary: List members of the current workspace
      responses:
        '200': { description: Member list }

  # ── Notifications ──────────────────────────────────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: List the current user's notifications (most recent first)
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count of unread notifications
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      responses:
        '200': { description: Marked as read }

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        '200': { description: Marked as read }

  # ── Support ────────────────────────────────────────────────────────────────
  /api/support/ticket:
    post:
      tags: [Support]
      summary: Create a support ticket via desk-ninja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                subject:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                  default: medium
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketNumber: { type: string }
                  portalUrl:    { type: string, format: uri }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502': { description: Support service error or timeout }
        '503': { description: Support is not available on this server }

  # ── Subscription ───────────────────────────────────────────────────────────
  /api/ninja-stack/status:
    get:
      tags: [Subscription]
      summary: Get the workspace's ninja-stack subscription status
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }

  /api/ninja-stack/activate:
    post:
      tags: [Subscription]
      summary: Activate a ninja-stack subscription code (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 200, example: nsk_xxxxxxxx }
      responses:
        '200':
          description: Activation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        '400': { description: Missing, invalid or expired code }
        '403': { description: Code does not include Ninja Planner (or caller is not an admin) }
        '409': { description: Code is already active on another workspace }
        '502': { description: Could not reach ninja-core }

  # ── External API (API key) ─────────────────────────────────────────────────
  /api/external/tasks:
    get:
      tags: [External API]
      summary: List tasks (newest first, max 200) — scope tasks:read
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Rate limited }
    post:
      tags: [External API]
      summary: Create a task — scope tasks:write
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:    { type: string, minLength: 1, maxLength: 500 }
                status:   { allOf: [{ $ref: '#/components/schemas/TaskStatus' }], default: todo }
                priority: { allOf: [{ $ref: '#/components/schemas/TaskPriority' }], default: medium }
                due_date: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  title:      { type: string }
                  status:     { $ref: '#/components/schemas/TaskStatus' }
                  priority:   { $ref: '#/components/schemas/TaskPriority' }
                  due_date:   { type: string, format: date, nullable: true }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/external/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [External API]
      summary: Update a task — scope tasks:write
      description: Status changes run the same side effects as the web app (recurrence, webhooks, automations).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:    { type: string, minLength: 1, maxLength: 500 }
                status:   { $ref: '#/components/schemas/TaskStatus' }
                priority: { $ref: '#/components/schemas/TaskPriority' }
                due_date: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  title:      { type: string }
                  status:     { $ref: '#/components/schemas/TaskStatus' }
                  priority:   { $ref: '#/components/schemas/TaskPriority' }
                  due_date:   { type: string, format: date, nullable: true }
                  updated_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/external/roadmap:
    get:
      tags: [External API]
      summary: List roadmap items (max 200) — scope roadmap:read
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Roadmap items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:           { type: string, format: uuid }
                    title:        { type: string }
                    description:  { type: string, nullable: true }
                    phase:        { type: string, nullable: true }
                    status:       { type: string }
                    priority:     { type: integer }
                    external_ref: { type: string, nullable: true }
                    created_at:   { type: string, format: date-time }
                    updated_at:   { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/external/goals:
    get:
      tags: [External API]
      summary: List goals (newest first, max 200) — scope goals:read
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:          { type: string, format: uuid }
                    title:       { type: string }
                    description: { type: string, nullable: true }
                    status:      { type: string, enum: [active, completed, cancelled] }
                    due_date:    { type: string, format: date, nullable: true }
                    created_at:  { type: string, format: date-time }
                    updated_at:  { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/external/sprints:
    get:
      tags: [External API]
      summary: List sprints (newest first, max 200) — scope sprints:read
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Sprints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sprint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
