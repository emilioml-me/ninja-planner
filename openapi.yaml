openapi: 3.0.3
info:
  title: Ninja Planner API
  version: 1.1.0
  description: |
    Multi-tenant business planning SaaS (ninja-planner) — REST API.

    This spec covers the most commonly integrated routes; it is not an exhaustive list of every
    internal endpoint the web app uses.

    **Public routes (no Bearer token)**: `/health`, the token-scoped share links under
    `/public/*` (public roadmap + votes, guest views), `GET /api/invites/token/{token}` (invite
    lookup; accepting needs a session), `/api/docs/` (`/api/docs` redirects there), and the signed inbound webhooks
    (`POST /webhooks/clerk` - svix signature; `POST /api/integrations/crm/webhook` and
    `POST /api/integrations/ninja-task/webhook` - HMAC signature). These are rate limited per
    client IP. Everything else under `/api/*` needs a token as described below.

    **Session API (`/api/*`)**: requires a Clerk-issued session JWT in
    `Authorization: Bearer <token>`. The workspace is resolved server-side from the Clerk
    organization claim in the token (the user's active organization); there is no workspace
    header or parameter. Routes marked "admin only" require the `org:admin` or `org:owner` role.

    **External API (`/api/external/*`)**: for third-party integrations. Authenticate with a
    workspace API key (created under Settings > API keys) in `Authorization: Bearer np_...`.
    Each route requires a specific key scope. Failed authentication attempts are rate limited
    per IP (20/min) and each key is limited to 300 requests/min.

    **Errors**: `{ "error": ... }`. Validation failures return 400 with `error` set to a zod
    `flatten()` object (`{ formErrors: string[], fieldErrors: { [field]: string[] } }`).

servers:
  - url: https://ninja-planner.com
    description: Production
  - url: https://ninja-planner.njn-stg.com
    description: Staging
  - url: http://localhost:3206
    description: Local dev

tags:
  - name: Health
  - name: Tasks
  - name: Sprints
  - name: Epics
  - name: Goals
  - name: Timeline
  - name: Budgets
  - name: Members
  - name: Notifications
  - name: Support
  - name: Subscription
  - name: Workspace
  - name: Reviews
  - name: Webhooks
  - name: Integrations
  - name: External API
  - name: Public
    description: Unauthenticated, token-scoped share links
  - name: Inbound webhooks
    description: Signed callbacks from Clerk and other ninja apps (no Bearer token)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: Workspace API key (`np_...`), sent as a Bearer token

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed (e.g. admin only, or API key lacks the required scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                formErrors:  { type: array, items: { type: string } }
                fieldErrors:
                  type: object
                  additionalProperties: { type: array, items: { type: string } }

    TaskStatus:
      type: string
      enum: [todo, in_progress, done, blocked]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    ChecklistItem:
      type: object
      required: [id, text, done]
      properties:
        id:   { type: string, maxLength: 64, description: Client-generated id }
        text: { type: string, maxLength: 500 }
        done: { type: boolean }

    Task:
      type: object
      properties:
        id:                { type: string, format: uuid }
        workspace_id:      { type: string, format: uuid }
        title:             { type: string }
        description:       { type: string, nullable: true }
        status:            { $ref: '#/components/schemas/TaskStatus' }
        priority:          { $ref: '#/components/schemas/TaskPriority' }
        assignee_clerk_id: { type: string, nullable: true }
        due_date:          { type: string, format: date, nullable: true }
        start_date:        { type: string, format: date, nullable: true }
        tags:              { type: array, items: { type: string } }
        position:          { type: integer }
        story_points:      { type: integer, nullable: true }
        sprint_id:         { type: string, format: uuid, nullable: true }
        epic_id:           { type: string, format: uuid, nullable: true }
        recurrence_rule:
          type: string
          nullable: true
          enum: [daily, weekly, biweekly, monthly]
        spawned_from_id:   { type: string, format: uuid, nullable: true }
        checklist:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        created_by:        { type: string }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Internal (always null in list responses). Clients should ignore it.
        external_ninja_task_id:
          type: string
          nullable: true
          readOnly: true
          description: Internal ninja-task sync id. Clients should ignore it.
        due_date_passed_notified_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Internal scheduler bookkeeping. Clients should ignore it.
        due_date_passed_dispatched_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Internal scheduler bookkeeping. Clients should ignore it.
      additionalProperties: true
      description: |
        Task rows are returned as stored, so the object can carry internal bookkeeping columns
        (listed as readOnly) and columns added by future migrations; ignore unknown properties.

    TaskActivity:
      type: object
      properties:
        id:             { type: string, format: uuid }
        task_id:        { type: string, format: uuid }
        actor_clerk_id: { type: string }
        action:         { type: string, example: updated }
        payload:        { type: object, additionalProperties: true, nullable: true }
        created_at:     { type: string, format: date-time }

    TaskWrite:
      type: object
      properties:
        description:       { type: string, maxLength: 10000 }
        status:            { $ref: '#/components/schemas/TaskStatus' }
        priority:          { $ref: '#/components/schemas/TaskPriority' }
        assignee_clerk_id: { type: string, nullable: true, description: Must be a workspace member; null = unassigned }
        due_date:          { type: string, format: date, nullable: true, description: 1900-01-01 .. 2199-12-31 }
        start_date:        { type: string, format: date, nullable: true, description: 1900-01-01 .. 2199-12-31 }
        tags:              { type: array, items: { type: string } }
        sprint_id:         { type: string, format: uuid, nullable: true }
        epic_id:           { type: string, format: uuid, nullable: true }
        recurrence_rule:
          type: string
          nullable: true
          enum: [daily, weekly, biweekly, monthly]
        story_points:      { type: integer, minimum: 0, maximum: 144, nullable: true }
        checklist:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ChecklistItem' }

    TimeLog:
      type: object
      properties:
        id:              { type: string, format: uuid }
        task_id:         { type: string, format: uuid }
        workspace_id:    { type: string, format: uuid }
        user_clerk_id:   { type: string }
        display_name:    { type: string, nullable: true }
        minutes:         { type: integer }
        note:            { type: string, nullable: true }
        billable:        { type: boolean }
        hourly_rate:     { type: string, nullable: true, description: NUMERIC(10,2) as a string }
        budget_entry_id: { type: string, format: uuid, nullable: true }
        logged_at:       { type: string, format: date-time }
        created_at:      { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id:            { type: string, format: uuid }
        task_id:       { type: string, format: uuid }
        workspace_id:  { type: string, format: uuid }
        file_name:     { type: string }
        file_size:     { type: string, example: '204800', description: BIGINT bytes, serialized as a string }
        mime_type:     { type: string }
        uploaded_by:   { type: string }
        uploader_name: { type: string, nullable: true }
        created_at:    { type: string, format: date-time }

    Sprint:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        status:
          type: string
          enum: [planning, active, completed]
        start_date: { type: string, format: date, nullable: true }
        end_date:   { type: string, format: date, nullable: true }
        goal:       { type: string, nullable: true }
        committed_points:
          type: string
          nullable: true
          description: |
            NUMERIC as a string. Story points snapshotted when the sprint became active (or at
            completion if it never was); null until then.
        committed_task_count:
          type: integer
          nullable: true
          description: Task count snapshotted alongside committed_points
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SprintWithStats:
      description: Sprint list item (GET /api/sprints)
      allOf:
        - $ref: '#/components/schemas/Sprint'
        - type: object
          properties:
            total_tasks: { type: integer, description: Non-deleted tasks in the sprint }
            done_tasks:  { type: integer, description: Of those, tasks with status done }

    Epic:
      type: object
      properties:
        id:           { type: string, format: uuid }
        title:        { type: string }
        description:  { type: string, nullable: true }
        color:        { type: string, example: '#6366f1' }
        status:
          type: string
          enum: [active, completed, archived]
        external_ref: { type: string, nullable: true }
        total_tasks:  { type: integer, description: Rollup - only on GET list/detail, not on POST/PATCH responses }
        done_tasks:   { type: integer, description: Rollup - only on GET list/detail }
        total_points: { type: integer, description: Rollup - only on GET list/detail }
        done_points:  { type: integer, description: Rollup - only on GET list/detail }
        created_by:   { type: string }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    Goal:
      type: object
      properties:
        id:          { type: string, format: uuid }
        title:       { type: string }
        description: { type: string, nullable: true }
        status:
          type: string
          enum: [active, completed, cancelled]
        due_date:    { type: string, format: date, nullable: true }
        total_tasks: { type: integer, description: 'Linked tasks + roadmap items (rollup - GET only, not on POST/PATCH responses)' }
        done_tasks:  { type: integer, description: 'Linked done tasks + live roadmap items (rollup - GET only)' }
        key_results:
          type: array
          description: Only on GET /api/goals (list), ordered by position
          items: { $ref: '#/components/schemas/KeyResult' }
        created_by:  { type: string }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    KeyResult:
      type: object
      properties:
        id:            { type: string, format: uuid }
        goal_id:       { type: string, format: uuid }
        title:         { type: string }
        target_value:  { type: string, description: NUMERIC as a string }
        current_value: { type: string, description: NUMERIC as a string }
        unit:          { type: string, example: '%' }
        position:      { type: integer }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }

    WeeklyReview:
      type: object
      additionalProperties: true
      properties:
        id:           { type: string, format: uuid }
        week_start:   { type: string, format: date }
        wins:         { type: string, nullable: true }
        blockers:     { type: string, nullable: true }
        focus_next:   { type: string, nullable: true }
        health_score: { type: integer, minimum: 1, maximum: 5, nullable: true }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    WebhookEndpoint:
      type: object
      properties:
        id:         { type: string, format: uuid }
        url:        { type: string, format: uri, description: 'Must be https in production and resolve to a public address' }
        events:     { type: array, items: { type: string } }
        active:     { type: boolean }
        secret:
          type: string
          description: |
            Only present on create and rotate-secret responses. Deliveries are signed with
            `X-Ninja-Signature: sha256=<hex HMAC-SHA256 of the raw body using this secret>`.
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id:                 { type: string, format: uuid }
        recipient_clerk_id: { type: string }
        type:               { type: string, example: task_assigned }
        title:              { type: string }
        body:               { type: string, nullable: true }
        link:               { type: string, nullable: true }
        read_at:            { type: string, format: date-time, nullable: true }
        created_at:         { type: string, format: date-time }

    SubscriptionStatus:
      type: object
      properties:
        active:        { type: boolean }
        plan:          { type: string, nullable: true }
        expiresAt:     { type: string, format: date-time, nullable: true }
        adminOverride: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [no_code, expired, app_not_allowed, revoked, ninja_core_unreachable]

    Health:
      type: object
      properties:
        status:  { type: string, enum: [ok, degraded] }
        app:     { type: string, example: ninja-planner }
        version: { type: string, example: 1.0.0, description: APP_VERSION env, else package.json version }
        db:      { type: string, enum: [ok, error] }

    ExternalTask:
      type: object
      properties:
        id:                { type: string, format: uuid }
        title:             { type: string }
        status:            { $ref: '#/components/schemas/TaskStatus' }
        priority:          { $ref: '#/components/schemas/TaskPriority' }
        assignee_clerk_id: { type: string, nullable: true }
        due_date:          { type: string, format: date, nullable: true }
        story_points:      { type: integer, nullable: true }
        sprint_id:         { type: string, format: uuid, nullable: true }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database unreachable (checked with a 2s timeout)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: degraded, app: ninja-planner, version: 1.0.0, db: error }

  # ── Tasks ──────────────────────────────────────────────────────────────────
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      description: |
        Returns at most `limit` tasks (default 500, max 1000). The `X-Total-Count` response
        header carries the total number of matching tasks so clients can detect truncation.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/TaskPriority' }
        - name: assignee
          in: query
          schema: { type: string }
          description: Clerk user id
        - name: tag
          in: query
          schema: { type: string }
        - name: due_before
          in: query
          schema: { type: string, format: date }
        - name: due_after
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Array of tasks
          headers:
            X-Total-Count:
              description: Total number of tasks matching the filters
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [Tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TaskWrite'
                - type: object
                  required: [title]
                  properties:
                    title:    { type: string, minLength: 1, maxLength: 500 }
                    position: { type: integer }
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/tasks/bulk:
    post:
      tags: [Tasks]
      summary: Bulk update or delete up to 200 tasks
      description: '`action: delete` is admin only.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [action, ids, changes]
                  properties:
                    action: { type: string, enum: [update] }
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items: { type: string, format: uuid }
                    changes:
                      type: object
                      additionalProperties: false
                      properties:
                        status:            { $ref: '#/components/schemas/TaskStatus' }
                        priority:          { $ref: '#/components/schemas/TaskPriority' }
                        assignee_clerk_id: { type: string, nullable: true }
                        sprint_id:         { type: string, format: uuid, nullable: true }
                - type: object
                  required: [action, ids]
                  properties:
                    action: { type: string, enum: [delete] }
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items: { type: string, format: uuid }
      responses:
        '200': { description: Result summary }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Tasks]
      summary: Get a task with its activity log
      responses:
        '200':
          description: Task and activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:     { $ref: '#/components/schemas/Task' }
                  activity:
                    type: array
                    items: { $ref: '#/components/schemas/TaskActivity' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      summary: Update a task (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TaskWrite'
                - type: object
                  properties:
                    title: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tasks]
      summary: Soft-delete a task (admin only)
      responses:
        '204': { description: Task deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{taskId}/time-logs:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tasks]
      summary: List time logs for a task (newest first)
      responses:
        '200':
          description: Time log entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TimeLog' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Tasks]
      summary: Log time on a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes:     { type: integer, minimum: 1, maximum: 14400 }
                note:        { type: string, maxLength: 500 }
                billable:    { type: boolean }
                hourly_rate:
                  type: number
                  minimum: 0
                  maximum: 10000
                  nullable: true
                  description: Admins only (403 for members)
      responses:
        '201':
          description: Time log created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/tasks/{taskId}/time-logs/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Tasks]
      summary: Edit a time log (own log; admins may edit any log)
      description: |
        At least one field is required. `hourly_rate` may only be sent by admins (members get
        403 even for their own log) - it is how an admin prices billable time a member logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                minutes:     { type: integer, minimum: 1, maximum: 14400 }
                note:        { type: string, maxLength: 500, nullable: true }
                billable:    { type: boolean }
                hourly_rate: { type: number, minimum: 0, maximum: 10000, nullable: true, description: Admins only }
      responses:
        '200':
          description: Updated time log
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Log not found or not yours }

  /api/tasks/{taskId}/attachments:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    get:
      tags: [Tasks]
      summary: List attachments for a task
      responses:
        '200':
          description: Attachment metadata list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: File attachments are not configured on this server }
    post:
      tags: [Tasks]
      summary: Confirm an upload made with a presigned URL and save the attachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, file_size, mime_type, r2_key]
              properties:
                file_name: { type: string, maxLength: 255 }
                file_size: { type: integer, minimum: 1, maximum: 52428800 }
                mime_type: { type: string, maxLength: 100 }
                r2_key:    { type: string, maxLength: 500, description: Key returned by /presign (bound to the caller) }
      responses:
        '201':
          description: Attachment saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Attachment already saved }

  /api/tasks/{taskId}/attachments/presign:
    parameters:
      - $ref: '#/components/parameters/TaskIdPath'
    post:
      tags: [Tasks]
      summary: Get a short-lived presigned R2 upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, mime_type, file_size]
              properties:
                file_name: { type: string, maxLength: 255 }
                mime_type: { type: string, maxLength: 100 }
                file_size: { type: integer, minimum: 1, maximum: 52428800 }
      responses:
        '200':
          description: Presigned upload URL (PUT the file to it, then POST the attachment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url: { type: string, format: uri }
                  r2_key:     { type: string }
                  file_name:  { type: string, description: Sanitized file name }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ── Sprints ────────────────────────────────────────────────────────────────
  /api/sprints:
    get:
      tags: [Sprints]
      summary: List sprints with task counts (active first, then planning, then completed)
      responses:
        '200':
          description: Sprint list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SprintWithStats' }
    post:
      tags: [Sprints]
      summary: Create a sprint (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string, minLength: 1, maxLength: 255 }
                goal:       { type: string, maxLength: 2000, nullable: true }
                status:
                  type: string
                  enum: [planning, active, completed]
                start_date: { type: string, format: date, nullable: true }
                end_date:   { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Sprint created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/sprints/{id}/burndown:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Sprints]
      summary: Burndown chart data for a sprint
      description: |
        When the sprint has no start/end date (or the range is empty) the response is just
        `{ total_tasks, total_points, points: [] }`: `start_date` / `end_date` are omitted, not null.
      responses:
        '200':
          description: Burndown series
          content:
            application/json:
              schema:
                type: object
                required: [total_tasks, total_points, points]
                properties:
                  start_date:   { type: string, format: date, description: Omitted when the sprint has no dates }
                  end_date:     { type: string, format: date, description: Omitted when the sprint has no dates }
                  total_tasks:  { type: integer }
                  total_points: { type: integer }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date:             { type: string, format: date }
                        remaining_tasks:  { type: integer }
                        remaining_points: { type: integer }
                        ideal_tasks:      { type: integer }
                        ideal_points:     { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Epics ──────────────────────────────────────────────────────────────────
  /api/epics:
    get:
      tags: [Epics]
      summary: List epics with task/point rollups
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, archived]
      responses:
        '200':
          description: Epic list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Epic' }
    post:
      tags: [Epics]
      summary: Create an epic (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:        { type: string, minLength: 1, maxLength: 500 }
                description:  { type: string }
                status:
                  type: string
                  enum: [active, completed, archived]
                color:        { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
                external_ref: { type: string, maxLength: 500, nullable: true, description: http(s) URL, e.g. a GitHub issue }
      responses:
        '201':
          description: Epic created (the stored row; rollup counts are not included - re-fetch the list for them)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Epic' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Goals ──────────────────────────────────────────────────────────────────
  /api/goals:
    get:
      tags: [Goals]
      summary: List goals with progress counts and their key results
      responses:
        '200':
          description: Goal list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Goal' }
    post:
      tags: [Goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:       { type: string, minLength: 1, maxLength: 500 }
                description: { type: string, maxLength: 5000, nullable: true }
                due_date:    { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Goal created (the stored row; total_tasks/done_tasks/key_results are not included)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/goals/{id}/links:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Goals]
      summary: Link a task or roadmap item to a goal (counts toward progress)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type: { type: string, enum: [task, roadmap_item] }
                entity_id:   { type: string, format: uuid }
      responses:
        '201': { description: Linked }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Link already exists }

  # ── Timeline ───────────────────────────────────────────────────────────────
  /api/timeline:
    get:
      tags: [Timeline]
      summary: Gantt data — dated tasks (capped, closest to today) + sprints
      responses:
        '200':
          description: Timeline payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:                { type: string, format: uuid }
                        title:             { type: string }
                        status:            { $ref: '#/components/schemas/TaskStatus' }
                        priority:          { $ref: '#/components/schemas/TaskPriority' }
                        start_date:        { type: string, format: date, nullable: true }
                        due_date:          { type: string, format: date, nullable: true }
                        assignee_clerk_id: { type: string, nullable: true }
                        assignee_name:     { type: string, nullable: true }
                        sprint_id:         { type: string, format: uuid, nullable: true }
                        sprint_name:       { type: string, nullable: true }
                        epic_id:           { type: string, format: uuid, nullable: true }
                        epic_title:        { type: string, nullable: true }
                        epic_color:        { type: string, nullable: true }
                        story_points:      { type: integer, nullable: true }
                  sprints:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: string, format: uuid }
                        name:       { type: string }
                        status:     { type: string }
                        start_date: { type: string, format: date, nullable: true }
                        end_date:   { type: string, format: date, nullable: true }
                  truncated:
                    type: boolean
                    description: True when tasks farthest from today were left out
                  today:
                    type: string
                    format: date
                    description: Today in the caller's time zone (X-Timezone header), used for the cap ordering

  # ── Budgets ────────────────────────────────────────────────────────────────
  /api/budgets:
    get:
      tags: [Budgets]
      summary: List budgets with actual spend (entries + billable time cost)
      responses:
        '200': { description: Budget list }
    post:
      tags: [Budgets]
      summary: Create a budget (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target_amount]
              properties:
                name:          { type: string, maxLength: 255 }
                description:   { type: string, maxLength: 2000, nullable: true }
                target_amount: { type: number, minimum: 0 }
                currency:      { type: string, minLength: 3, maxLength: 3, default: USD }
                period_start:  { type: string, format: date, nullable: true }
                period_end:    { type: string, format: date, nullable: true }
                status:        { type: string, enum: [active, closed] }
                epic_id:       { type: string, format: uuid, nullable: true }
                sprint_id:     { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Budget created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Workspace ──────────────────────────────────────────────────────────────
  /api/workspaces/me:
    get:
      tags: [Workspace]
      summary: The workspace for the token's active organization, plus the caller's role
      description: |
        `my_role` comes from workspace_members.role (the same source the server uses for admin
        checks), so clients should gate admin/viewer UI on it rather than on the Clerk token.
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  id:           { type: string, format: uuid }
                  name:         { type: string }
                  clerk_org_id: { type: string }
                  my_role:      { type: string, nullable: true, example: 'org:admin', description: 'Stored member role, e.g. org:owner, org:admin, org:member or viewer (read-only)' }
        '403': { description: No active organization in the token }
        '404': { description: Workspace not provisioned yet (Clerk webhook still in flight) or caller is not a member }

  # ── Members ────────────────────────────────────────────────────────────────
  /api/workspaces/me/members:
    get:
      tags: [Members]
      summary: List members of the current workspace
      responses:
        '200': { description: Member list }

  # ── Reviews ────────────────────────────────────────────────────────────────
  /api/reviews:
    get:
      tags: [Reviews]
      summary: List weekly reviews (newest week first), paginated
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Review page
          headers:
            X-Total-Count:
              description: Total number of reviews in the workspace
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WeeklyReview' }

  # ── Webhooks (outbound, admin managed) ─────────────────────────────────────
  /api/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints (admin only; secrets are never included)
      responses:
        '200':
          description: Endpoint list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/webhooks/events:
    get:
      tags: [Webhooks]
      summary: Subscribable webhook event types (any member)
      responses:
        '200':
          description: Event names
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { type: string }
                    example: [task.created, task.updated, task.completed, task.deleted, review.submitted, epic.created, epic.updated, epic.deleted, sprint.completed, goal.completed]

  /api/webhooks/{id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Webhooks]
      summary: Generate a new signing secret (admin only)
      description: |
        Returns the endpoint including the NEW `secret` - the only time it is shown. The old secret
        stops validating immediately, so update the receiver right away.
      responses:
        '200':
          description: Endpoint with its new secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Integrations ───────────────────────────────────────────────────────────
  /api/integrations/capabilities:
    get:
      tags: [Integrations]
      summary: Which integration-backed actions do something for this workspace
      description: No external calls; used by the UI to hide controls that would no-op or 503.
      responses:
        '200':
          description: Capability flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  slack_alerts:  { type: boolean, description: Operator workspace and SLACK_WEBHOOK_URL set }
                  payments_sync: { type: boolean, description: Operator workspace and payment-ninja configured }
                  crm_linked:    { type: boolean, description: Workspace linked to a crm-ninja tenant and CRM configured }

  # ── Notifications ──────────────────────────────────────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: List the current user's notifications (most recent first)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Count of unread notifications
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /api/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Notifications]
      summary: Mark one notification as read
      responses:
        '200': { description: Marked as read }

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        '200': { description: Marked as read }

  # ── Support ────────────────────────────────────────────────────────────────
  /api/support/ticket:
    post:
      tags: [Support]
      summary: Create a support ticket via desk-ninja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                subject:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                  default: medium
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketNumber: { type: string }
                  portalUrl:    { type: string, format: uri }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limited (10 tickets per user per 10 minutes) or desk-ninja quota reached }
        '502': { description: Support service error or timeout }
        '503': { description: Support is not available on this server }

  # ── Subscription ───────────────────────────────────────────────────────────
  /api/ninja-stack/status:
    get:
      tags: [Subscription]
      summary: Get the workspace's ninja-stack subscription status
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }

  /api/ninja-stack/workspaces/{workspaceId}/override:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Subscription]
      summary: Grant a workspace free access (platform admins only - PLATFORM_ADMIN_USER_IDS)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, default: pro }
      responses:
        '200': { description: Override granted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Subscription]
      summary: Revoke the override (falls back to the workspace's real code, if any)
      responses:
        '200': { description: Override revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/ninja-stack/workspaces/{workspaceId}/override/audit:
    parameters:
      - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Subscription]
      summary: Override audit log for a workspace (platform admins only)
      responses:
        '200': { description: Audit entries, newest first }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/ninja-stack/activate:
    post:
      tags: [Subscription]
      summary: Activate a ninja-stack subscription code (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 200, example: nsk_xxxxxxxx }
      responses:
        '200':
          description: Activation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionStatus' }
        '400': { description: Missing, invalid or expired code }
        '403': { description: Code does not include Ninja Planner (or caller is not an admin) }
        '409': { description: Code is already active on another workspace }
        '502': { description: Could not reach ninja-core }

  # ── External API (API key) ─────────────────────────────────────────────────
  /api/external/tasks:
    get:
      tags: [External API]
      summary: List tasks (newest first, paginated) — scope tasks:read
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Task list
          headers:
            X-Total-Count:
              description: Total number of tasks in the workspace
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExternalTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Rate limited }
    post:
      tags: [External API]
      summary: Create a task — scope tasks:write
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:    { type: string, minLength: 1, maxLength: 500 }
                status:   { allOf: [{ $ref: '#/components/schemas/TaskStatus' }], default: todo }
                priority: { allOf: [{ $ref: '#/components/schemas/TaskPriority' }], default: medium }
                due_date: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  title:      { type: string }
                  status:     { $ref: '#/components/schemas/TaskStatus' }
                  priority:   { $ref: '#/components/schemas/TaskPriority' }
                  due_date:   { type: string, format: date, nullable: true }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/external/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [External API]
      summary: Update a task — scope tasks:write
      description: Status changes run the same side effects as the web app (recurrence, webhooks, automations).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:    { type: string, minLength: 1, maxLength: 500 }
                status:   { $ref: '#/components/schemas/TaskStatus' }
                priority: { $ref: '#/components/schemas/TaskPriority' }
                due_date: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  title:      { type: string }
                  status:     { $ref: '#/components/schemas/TaskStatus' }
                  priority:   { $ref: '#/components/schemas/TaskPriority' }
                  due_date:   { type: string, format: date, nullable: true }
                  updated_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/external/roadmap:
    get:
      tags: [External API]
      summary: List roadmap items (max 200) — scope roadmap:read
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Roadmap items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:           { type: string, format: uuid }
                    title:        { type: string }
                    description:  { type: string, nullable: true }
                    phase:        { type: string, nullable: true }
                    status:       { type: string }
                    priority:     { type: integer }
                    external_ref: { type: string, nullable: true }
                    created_at:   { type: string, format: date-time }
                    updated_at:   { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/external/goals:
    get:
      tags: [External API]
      summary: List goals (newest first, max 200) — scope goals:read
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:          { type: string, format: uuid }
                    title:       { type: string }
                    description: { type: string, nullable: true }
                    status:      { type: string, enum: [active, completed, cancelled] }
                    due_date:    { type: string, format: date, nullable: true }
                    created_at:  { type: string, format: date-time }
                    updated_at:  { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/external/sprints:
    get:
      tags: [External API]
      summary: List sprints (newest first, max 200) — scope sprints:read
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Sprints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sprint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Public share links (no auth, rate limited per IP) ──────────────────────
  /public/roadmap/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Public]
      summary: Public roadmap for a share token (with vote counts)
      security: []
      responses:
        '200': { description: Roadmap items visible on the public link }
        '404': { description: Roadmap not found or link expired }
        '429': { description: Rate limited }

  /public/roadmap/{token}/votes/{itemId}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Public]
      summary: Vote for a roadmap item (one vote per visitor/IP per item)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id]
              properties:
                visitor_id: { type: string, minLength: 1, maxLength: 128, description: Random id kept by the browser }
      responses:
        '200': { description: Vote recorded (or already present) }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { description: Item, roadmap or link not found }
        '429': { description: Rate limited }
    delete:
      tags: [Public]
      summary: Remove this visitor's vote
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visitor_id]
              properties:
                visitor_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Vote removed }
        '404': { description: Item, roadmap or link not found }
        '429': { description: Rate limited }

  /public/g/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Public]
      summary: Guest view for a project share link
      description: |
        Returns `{ label, scopes }` plus one list per granted scope (tasks, roadmap, ...). Only
        display fields are included - no internal ids, assignee ids, tags or descriptions.
      security: []
      responses:
        '200': { description: Guest view payload }
        '404': { description: Link not found or expired }
        '429': { description: Rate limited }

  /api/invites/token/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      tags: [Public]
      summary: Look up an unused, unexpired invite (no auth)
      security: []
      responses:
        '200':
          description: Invite summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace_name: { type: string }
                  expires_at:     { type: string, format: date-time }
        '404': { description: Invite not found or expired }
        '429': { description: Rate limited }

  /api/invites/token/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      tags: [Members]
      summary: Accept an invite as the signed-in user (session token required)
      responses:
        '200': { description: Joined the workspace }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Invite not found or expired }

  # ── Inbound webhooks (signature-verified, no Bearer token) ─────────────────
  /webhooks/clerk:
    post:
      tags: [Inbound webhooks]
      summary: Clerk events (organization/membership/user sync)
      description: Verified with svix headers (`svix-id`, `svix-timestamp`, `svix-signature`) and CLERK_WEBHOOK_SECRET.
      security: []
      responses:
        '200': { description: Processed }
        '400': { description: Missing or invalid signature }

  /api/integrations/crm/webhook:
    post:
      tags: [Inbound webhooks]
      summary: crm-ninja events for a linked tenant
      description: HMAC-signed with CRM_WEBHOOK_SECRET over the raw body.
      security: []
      responses:
        '200': { description: Processed }
        '400': { description: Malformed payload }
        '401': { description: Missing or invalid signature }
        '403': { description: Workspace is not linked to this CRM account }
        '429': { description: Rate limited }

  /api/integrations/ninja-task/webhook:
    post:
      tags: [Inbound webhooks]
      summary: ninja-task events (task_complete)
      description: HMAC-signed with NINJA_TASK_WEBHOOK_SECRET over the raw body.
      security: []
      responses:
        '200': { description: Processed }
        '400': { description: Malformed payload }
        '401': { description: Invalid signature }
        '429': { description: Rate limited }
