upstream ninja_planner {
    server 127.0.0.1:3207;
}

# Token-bearing public pages (guest views, public roadmaps, invites) and their /public API
# must not be indexed. An empty value means nginx does not emit the header at all, so this is
# safe to set at server level without touching the proxy location.
map $uri $ninja_planner_robots_tag {
    default                       "";
    ~^/(g|r|invite|public)/       "noindex, nofollow";
}

# M4: HTTP -> HTTPS redirect (applies before certbot fills in the HTTPS block)
server {
    listen 80;
    server_name ninja-planner.com;

    # Allow Let's Encrypt ACME challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://ninja-planner.com$request_uri;
    }
}

# www -> apex. Clerk authorizedParties only lists the apex origin, so every API call from www
# would 401; always send www to the canonical host.
server {
    listen 80;
    server_name www.ninja-planner.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ninja-planner.com$request_uri;
    }
}

# HTTPS block. The certificate must exist before `nginx -t` will pass. First issue it via the
# port-80 ACME location above (the HTTP server block alone is enough for this):
#   sudo certbot certonly --webroot -w /var/www/html -d ninja-planner.com -d www.ninja-planner.com
server {
    listen 443 ssl;
    server_name www.ninja-planner.com;

    ssl_certificate     /etc/letsencrypt/live/ninja-planner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninja-planner.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://ninja-planner.com$request_uri;
}

server {
    listen 443 ssl;
    server_name ninja-planner.com;

    ssl_certificate     /etc/letsencrypt/live/ninja-planner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ninja-planner.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $ninja_planner_robots_tag always;

    location / {
        proxy_pass         http://ninja_planner;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        client_max_body_size 20M;
    }
}
