upstream ninja_planner {
    server 127.0.0.1:3207;
}

# M4: HTTP → HTTPS redirect (applies before certbot fills in the HTTPS block)
server {
    listen 80;
    server_name ninja-planner.com www.ninja-planner.com;

    # Allow Let's Encrypt ACME challenges through
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS block — certbot fills in ssl_certificate / ssl_certificate_key
# and adds include /etc/letsencrypt/options-ssl-nginx.conf after first run.
# Run: sudo certbot --nginx -d ninja-planner.com -d www.ninja-planner.com
server {
    listen 443 ssl;
    server_name ninja-planner.com www.ninja-planner.com;

    # Certbot will populate these:
    # ssl_certificate     /etc/letsencrypt/live/ninja-planner.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ninja-planner.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://ninja_planner;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        client_max_body_size 20M;
    }
}
