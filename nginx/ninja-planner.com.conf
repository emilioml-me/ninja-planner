upstream ninja_planner {
    server 127.0.0.1:3207;
}

server {
    listen 80;
    server_name ninja-planner.com www.ninja-planner.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://ninja_planner;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        client_max_body_size 20M;
    }
}

# Run: sudo certbot --nginx -d ninja-planner.com -d www.ninja-planner.com
# Certbot will add the HTTPS server block automatically.
