upstream ninja_planner_stg {
    server 127.0.0.1:3208;
}

server {
    listen 80;
    server_name ninja-planner.njn-stg.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ninja-planner.njn-stg.com;

    ssl_certificate     /etc/letsencrypt/live/njn-stg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/njn-stg.com/privkey.pem;

    # Same as prod. Staging has no www host (the njn-stg.com cert does not cover
    # www.ninja-planner.njn-stg.com); if one is ever added, give it its own server block that
    # returns 301 to https://ninja-planner.njn-stg.com$request_uri, like the prod conf does.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Staging must never be indexed (header covers every response, robots.txt below covers crawlers
    # that only read robots).
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20M;

    # Served by nginx so the app's production robots.txt (Allow: /) never reaches crawlers here.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://ninja_planner_stg;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
