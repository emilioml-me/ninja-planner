upstream ninja_planner_prod {
    server 127.0.0.1:3206;
}

# HTTP — redirect to HTTPS + handle certbot challenges
server {
    listen 80;
    server_name plan-ninja.com www.plan-ninja.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://plan-ninja.com$request_uri;
    }
}

# www → apex redirect (HTTPS)
server {
    listen 443 ssl;
    server_name www.plan-ninja.com;

    ssl_certificate     /etc/letsencrypt/live/plan-ninja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan-ninja.com/privkey.pem;

    return 301 https://plan-ninja.com$request_uri;
}

# Main HTTPS vhost
server {
    listen 443 ssl;
    server_name plan-ninja.com;

    ssl_certificate     /etc/letsencrypt/live/plan-ninja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan-ninja.com/privkey.pem;

    # Allow up to 20 MB uploads (attachments)
    client_max_body_size 20M;

    # Security headers (app also sets these via helmet, belt-and-suspenders)
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff    always;

    location / {
        proxy_pass         http://ninja_planner_prod;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        # Buffer settings for SSE / streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }
}
